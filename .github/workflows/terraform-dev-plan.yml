name: Terraform Dev Plan

concurrency:
  group: terraform-dev-state
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'infra/dev/**'
      - '.github/workflows/terraform-dev-plan.yml'

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: terraform-plan-dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::980819806665:role/GitHubActions-Terraform-DevPlan
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize dev backend
        working-directory: infra/dev
        run: terraform init -input=false -backend-config=dev.backend.hcl

      - name: Validate dev configuration
        working-directory: infra/dev
        run: terraform validate -no-color

      - name: Verify plan commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Checked-out commit: $ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
          echo "Commit check passed."

      - name: Record Terraform state fingerprint
        working-directory: infra/dev
        shell: bash
        run: |
          set -euo pipefail
          STATE_SHA256=$(terraform state pull | sha256sum | awk '{print $1}')
          echo "STATE_SHA256=$STATE_SHA256" >> "$GITHUB_ENV"
          echo "State fingerprint recorded."

      - name: Generate saved plan
        working-directory: infra/dev
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=terraform.tfvars \
            -out=dev.tfplan

      - name: Record plan metadata and approval summary
        working-directory: infra/dev
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: terraform-dev-plan-${{ github.run_id }}
        run: |
          set -euo pipefail

          PLAN_SHA256=$(sha256sum dev.tfplan | awk '{print $1}')
          : "${STATE_SHA256:?State fingerprint is missing}"
          REVIEW_DATE=$(date -u +%F)

          printf 'repository=%s\nenvironment=dev\ncommit_sha=%s\nrun_id=%s\nrun_url=%s\nplan_sha256=%s\nstate_sha256=%s\n' \
            "$REPOSITORY" "$COMMIT_SHA" "$RUN_ID" "$RUN_URL" "$PLAN_SHA256" "$STATE_SHA256" \
            > dev-plan-metadata.txt

          cat > dev-plan-approval.md <<EOF
          # Terraform Dev Plan Review

          - Repository: $REPOSITORY
          - Environment: dev
          - Commit SHA: $COMMIT_SHA
          - Actions run ID: $RUN_ID
          - Actions run: $RUN_URL
          - Saved plan SHA-256: $PLAN_SHA256
          - State SHA-256: $STATE_SHA256
          - Generated (UTC): $REVIEW_DATE
          - Reviewer: Pending
          - Decision: Pending
          - Notes: Pending

          ## Review checklist
          - [ ] Verify the plan hash against the downloaded plan.
          - [ ] Inspect the plan for unintended changes.
          - [ ] Confirm the commit and state evidence are relevant.
          - [ ] Record a genuine review decision.

          This record does not enforce approval or authorize deployment.
          Any relevant configuration, input, state, or plan change requires a fresh review.
          EOF

          {
            echo "## Terraform Dev Plan"
            echo
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Plan SHA-256: \`$PLAN_SHA256\`"
            echo "- State SHA-256: \`$STATE_SHA256\`"
            echo "- Decision: Pending"
            echo
            echo "[Open this run to download the plan and review record]($RUN_URL)"
            echo
            echo "The artifact \`$ARTIFACT_NAME\` contains the saved plan, metadata, and review record."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan, metadata, and review record
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: |
            infra/dev/dev.tfplan
            infra/dev/dev-plan-metadata.txt
            infra/dev/dev-plan-approval.md
          if-no-files-found: error
          retention-days: 1
