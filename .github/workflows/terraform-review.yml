name: Terraform Review

on: push: branches: - main pull_request: branches: - main

permissions: contents: read

jobs: terraform-review: name: Terraform Review runs-on: ubuntu-latest

strategy: fail-fast: false matrix: terraform-directory: - infra/dev - infra/bootstrap

defaults: run: shell: bash

steps: - name: Checkout uses: actions/checkout@v6

- name: Setup Terraform uses: hashicorp/setup-terraform@v3 with: terraform_version: 1.10.5

- name: Terraform Format Check run: terraform fmt -check -recursive

- name: Terraform Init working-directory: ${{ matrix.terraform-directory }} run: terraform init -backend=false -input=false

- name: Terraform Validate working-directory: ${{ matrix.terraform-directory }} run: terraform validate -no-color

# IMPORTANT: # Do not run terraform test until all tests have been reviewed # and converted to safe mocked-provider plan tests. # # Some Terraform tests use command = apply and can create real # AWS resources. Deployment-specific variables alone do not # make those tests safe. # # This workflow intentionally performs validation only. # No AWS credentials are configured and no deployment is run.

- name: Secret Scan uses: gitleaks/gitleaks-action@v3 env: GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
